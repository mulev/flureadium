# Flureadium validators. Runner: ./validate · doctrine: skills/_shared/validators.md
#
# stage | id | command        (command runs from this repo root via `sh -c`)
#   phase-exit  every phase, before plan update / commit / bead close
#   finalize    once per execution, main session
#   user        handed over, never run automatically
#
# run_native_unit_tests.sh (reached through --skip-integration) builds the iOS app
# itself and compiles the Kotlin through testDebugUnitTest, so separate build rows
# would pay for the same compile twice. --no-rerun reuses the Gradle cache for the
# per-phase runs; finalize keeps the runner's clean-rebuild default.
#
# static-lints is separate from static because flureadium_lints is a pure Dart
# package: the static loop runs `flutter analyze`, which is the wrong tool there.
# Its test suite needs no row — run_all_tests.sh runs it as a unit row already.
#
# static-plugin runs the same three package dirs through `dart analyze
# --fatal-infos`, the only command that surfaces flureadium_lints diagnostics —
# `flutter analyze` reports nothing. It adds to the static row rather than
# replacing it. Full account: flureadium/docs/05-testing/lint-rules.md
#
# static-plugin-canary is the positive control for that row: `dart analyze`
# exits 0 both when the rules ran clean and when they never loaded, so the
# script plants a known-vacuous assertion in each package and requires both
# diagnostics back. Without it a broken plugins: block reads as green.

phase-exit | static | for d in flureadium flureadium_platform_interface flureadium/example; do (cd "$d" && dart format --output=none --set-exit-if-changed . && flutter analyze) || exit 1; done
phase-exit | static-plugin | for d in flureadium flureadium_platform_interface flureadium/example; do (cd "$d" && dart analyze --fatal-infos) || exit 1; done
phase-exit | static-plugin-canary | ./flureadium/scripts/check_lint_wiring.sh
phase-exit | static-lints | cd flureadium_lints && dart format --output=none --set-exit-if-changed . && dart analyze
phase-exit | suites | cd flureadium && ./scripts/run_all_tests.sh --skip-integration --no-rerun
finalize   | all    | cd flureadium && ./scripts/run_all_tests.sh

# The tap chain has two halves no runner can drive. iOS: `WidgetTester` never
# synthesizes a `UITouch`, so a tap over a `UiKitView` reaches the gesture arena
# and stops there. Android fixed layout: a synthesized tap does become a real
# `MotionEvent` and the native view logs the `ACTION_DOWN`, but the fixed-layout
# script path never reports it — five taps produced nothing where `adb shell
# input tap` at the same point reported at once. Reflowable EPUB on Android is
# automated in example/integration_test/tap_test.dart; everything below is what
# is left, and it is a real device or simulator by hand.
user       | tap    | cd flureadium/example && flutter run --release -d <device>   # both platforms: an iOS device or simulator for the iOS items, an Android device or emulator for the fixed-layout one. Checklist: project_plans/flureadium/done/flureadium_feat_native_tap_callback/phase_5_prove_the_tap.md
