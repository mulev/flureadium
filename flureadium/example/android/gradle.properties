org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Flutter runs Gradle with -q, and a task that fails with an empty cause then
# prints "What went wrong:" and nothing else — which is how :app:validateSigningDebug
# failed on CI with no message at all. Always print the exception chain.
org.gradle.logging.stacktrace=all
