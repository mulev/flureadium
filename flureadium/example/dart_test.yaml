# On an iOS simulator, flutter_tools discovers the Dart VM service URL by
# scraping one os_log line out of `simctl spawn ... log stream`. There is no
# mDNS or fallback path and the wait is unbounded, so a single dropped log
# record hangs the run until CI kills the step. test_core 0.6.16 removed the
# 12-minute suite-load default and set it to `none`, which took away the last
# backstop.
#
# Scoped to macOS, the only host that runs an iOS simulator. The Android and
# web jobs run on Linux, where this section is not merged and the file loads
# to an empty configuration.
#
# 10m is roughly 1.6x the slowest healthy load phase measured in CI (6m05s).
# Older SDKs that predate this key ignore it, so local runs are unaffected.
on_os:
  mac-os:
    suite_load_timeout: 10m

# Tags in use across the integration suites. Undeclared tags make the runner
# print "Tags were used that weren't specified in dart_test.yaml" and list every
# tagged test, which buried the useful output of a device run in 28 lines of
# noise. Each tag names an environment requirement, and CI selects on it —
# .github/scripts/android_integration_tests.sh passes
# --exclude-tags "native || network" because a GitHub-hosted emulator has
# neither an audio engine nor a route to the public internet.
#
#   native  — needs a real audio or TTS engine
#   network — needs the public internet
#   web     — web-only, reached through all_tests_web.dart
tags:
  native:
  network:
  web:
