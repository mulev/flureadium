name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-platform-interface:
    name: Test Platform Interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flureadium_platform_interface
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: platform-interface

  test-main-package:
    name: Test Main Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flureadium
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: main-package

  test-example-widget:
    name: Test Example (Widget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flureadium/example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run widget tests
        run: flutter test test/

      # The predicate fails closed: every internal error reads as "not the
      # hang", which quietly disables the iOS retry. Run its fixtures here so a
      # regression shows up as a red check rather than as a retry that stopped
      # happening.
      - name: Check the iOS suite-load predicate
        working-directory: .
        run: .github/scripts/ios_suite_load_timed_out_test.sh

      # Covers the Android diagnostics wrapper, including the check that the
      # emulator-runner still gets its script as a single command. A block
      # scalar there silently splits into one shell per line.
      - name: Check the Android integration wrapper
        working-directory: .
        run: .github/scripts/android_integration_tests_test.sh

      # Covers the JDK pins. JDK 18.0.2 — everything `java-version: '18'` can
      # resolve — dies inside AGP on any runner whose kernel drops the memory
      # row from /proc/cgroups, and JDK 17 cannot compile JvmTarget.JVM_18.
      - name: Check the workflow JDK pins
        working-directory: .
        run: .github/scripts/workflow_jdk_pin_test.sh

  # The rule tests run under `dart test`, never `flutter test`:
  # test_reflective_loader imports dart:mirrors, which the Flutter test runtime
  # rejects — and then hangs retrying the load instead of exiting.
  test-lints:
    name: Test Lint Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flureadium_lints
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      # --enforce-lockfile so a lock that no longer resolves fails here instead
      # of being silently rewritten; run_all_tests.sh resolves the same way.
      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

  # Nothing ran the helper-script suite before this job existed, and nothing
  # checked that the committed bundle matches its TypeScript. A source edit
  # without `npm run build:flutter` used to ship silently: the webview kept
  # loading the old bundle and every other suite stayed green.
  test-helper-scripts:
    name: Test Helper Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flureadium/assets/_helper_scripts
    steps:
      - uses: actions/checkout@v4

      # Node 22 is the pin the freshness check depends on: the bundle is
      # byte-reproducible for a given Node major, not across majors.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: flureadium/assets/_helper_scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npx jest, not `npm test`: the test script is `jest --watchAll` and
      # would never exit.
      - name: Run jest
        run: npx jest --ci

      # The bundle is the artifact that actually ships to the webview.
      # `git status --porcelain`, not `git diff`: diff sees tracked modifications
      # only, so a newly emitted file would land untracked and pass.
      - name: Check the shipped bundle matches its source
        run: |
          npm run build:flutter
          if [ -n "$(git status --porcelain -- ../helpers)" ]; then
            git --no-pager diff --stat -- ../helpers
            git status --porcelain -- ../helpers
            echo "::error file=flureadium/assets/helpers/epub.js::Stale bundle. Run 'npm run build:flutter' in flureadium/assets/_helper_scripts and commit the result."
            exit 1
          fi

  test-android-native:
    name: Test Android Native (Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flureadium/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Run Android unit tests (Robolectric)
        run: gradle testDebugUnitTest --console=plain

  test-ios-native:
    name: Test iOS Native (XCTest)
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: flureadium/example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        timeout-minutes: 6
        run: cd ios && pod install --repo-update

      - name: Build for simulator
        timeout-minutes: 10
        run: flutter build ios --simulator --debug

      - name: Run XCTest (RunnerTests)
        timeout-minutes: 25
        run: |
          UDID=$(xcrun simctl list devices booted | grep "iPhone" | grep -oE '\([A-F0-9-]+\)' | tr -d '()' | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
            echo "Booting simulator: $UDID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID"
          fi
          cd ios
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$UDID" \
            -only-testing:RunnerTests
