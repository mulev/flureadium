name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Android Example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flureadium/example
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '18'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      # - name: Run Android native tests
      #   run: |
      #     cd android
      #     ./gradlew testDebugUnitTest --no-daemon --info

      # - name: Print test results on failure
