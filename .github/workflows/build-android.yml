      #     echo "=== Test Results ==="
      #     find . -path "*/test-results/*" -name "*.xml" -exec cat {} \;
      #     echo "=== Test Reports ==="
      #     find . -path "*/reports/tests/*" -name "*.html" -exec cat {} \; 2>/dev/null || true

      # - name: Upload test results
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: android-test-results
      #     path: |
      #       flureadium/example/build/flureadium/reports/tests/
      #       flureadium/example/build/flureadium/test-results/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: flureadium/example/build/app/outputs/flutter-apk/app-debug.apk
