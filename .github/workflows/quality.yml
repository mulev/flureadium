name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check format - platform interface
        run: dart format --set-exit-if-changed flureadium_platform_interface/lib

      - name: Check format - main package
        run: dart format --set-exit-if-changed flureadium/lib

      - name: Check format - example
        run: dart format --set-exit-if-changed flureadium/example/lib

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies - platform interface
        working-directory: flureadium_platform_interface
        run: flutter pub get

      - name: Get dependencies - main package
        working-directory: flureadium
        run: flutter pub get

      - name: Analyze - platform interface
        working-directory: flureadium_platform_interface
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Analyze - main package
        working-directory: flureadium
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Get dependencies - example
        working-directory: flureadium/example
        run: flutter pub get

      # dart analyze is what enforces the two flureadium_lints rules; flutter
      # analyze reports nothing. See flureadium/docs/05-testing/lint-rules.md.
      - name: Plugin lints - platform interface
        working-directory: flureadium_platform_interface
        run: dart analyze --fatal-infos

      - name: Plugin lints - main package
        working-directory: flureadium
        run: dart analyze --fatal-infos

      - name: Plugin lints - example
        working-directory: flureadium/example
        run: dart analyze --fatal-infos

      # Positive control: dart analyze exits 0 whether the rules ran or never
      # loaded, so require both diagnostics on a planted violation.
      - name: Plugin lints - wiring canary
        working-directory: .
        run: ./flureadium/scripts/check_lint_wiring.sh

  pub-score:
    name: Pub.dev Score Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install pana
        run: dart pub global activate pana

      - name: Check platform interface score
        working-directory: flureadium_platform_interface
        run: |
          flutter pub get
          pana --no-warning --exit-code-threshold 100

      - name: Check main package score
        working-directory: flureadium
        run: |
          flutter pub get
          pana --no-warning --exit-code-threshold 100
