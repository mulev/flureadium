name: Release

# The two packages version independently, so a release tag names one of them:
#   flureadium-0.16.1          -> flureadium/
#   platform-interface-0.10.1  -> flureadium_platform_interface/
# Publish the platform interface first when a release spans both.

on:
  push:
    tags:
      - 'flureadium-*'
      - 'platform-interface-*'

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package: ${{ steps.target.outputs.package }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tagged package
        id: target
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          case "$TAG" in
            platform-interface-*)
              PACKAGE=flureadium_platform_interface
              VERSION=${TAG#platform-interface-}
              ;;
            flureadium-*)
              PACKAGE=flureadium
              VERSION=${TAG#flureadium-}
              ;;
            *)
              echo "Tag '$TAG' names no package."
              echo "Use flureadium-<version> or platform-interface-<version>."
              exit 1
              ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate the tag matches the pubspec
        env:
          PACKAGE: ${{ steps.target.outputs.package }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2; exit}' "$PACKAGE/pubspec.yaml")
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag says $VERSION, $PACKAGE/pubspec.yaml says $PUBSPEC_VERSION."
            exit 1
          fi

      - name: Validate the CHANGELOG entry
        env:
          PACKAGE: ${{ steps.target.outputs.package }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          if ! grep -Fxq "## $VERSION" "$PACKAGE/CHANGELOG.md"; then
            echo "$PACKAGE/CHANGELOG.md has no '## $VERSION' heading."
            exit 1
          fi

  publish-dry-run:
    name: Publish Dry Run
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Dry run
        working-directory: ${{ needs.validate.outputs.package }}
        run: |
          flutter pub get
          dart pub publish --dry-run

  create-release:
    name: Create GitHub Release
    needs: [validate, publish-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract the changelog section
        id: changelog
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          SECTION=$(awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "$PACKAGE/CHANGELOG.md" | sed -e '/^---$/d' -e 's/[[:space:]]*$//')
          {
            echo "body<<CHANGELOG_EOF"
            echo "$SECTION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.validate.outputs.package }} ${{ needs.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
